name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Spelling
        run: bun run spellcheck

      - name: Markdown
        run: bun run lint:md

      - name: ESLint
        run: bun run lint

      - name: Screenshot extractors
        run: bun run shots:verify

      - name: Build
        run: bun run build

      # After the build, which generates the content types.
      - name: Types
        run: bun run types:check

      - name: Links and images
        run: bun run links:check
