# Checks every pull request. Advisory for now: a failure is reported but does
# not fail the run. Deployment stays in deploy.yml and does not depend on this.
# Remove `continue-on-error` to enforce these checks.
name: Quality checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  VALE_VERSION: 3.24.0

jobs:
  quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vale
        run: |
          mkdir -p "$RUNNER_TEMP/vale"
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      - name: Download Vale styles
        run: bun run prose:sync

      - name: Spelling
        run: bun run spellcheck

      - name: Markdown
        run: bun run lint:md

      - name: Prose
        run: bun run lint:prose

      - name: ESLint
        run: bun run lint

      - name: Screenshot extractors
        run: bun run shots:verify

      - name: Build
        run: bun run build

      # After the build, which generates the content types.
      - name: Types
        run: bun run types:check

      - name: Links and images
        run: bun run links:check
