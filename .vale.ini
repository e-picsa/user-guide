# Prose style checks, run with `bun run lint:prose`.
# `bun run prose:sync` downloads the Google style into styles/ (not committed).
# Only errors fail the check, so PICSA rules are errors and Google rules advise.
StylesPath = styles
MinAlertLevel = warning
Packages = Google
Vocab = PICSA

[formats]
mdx = md

[*.mdx]
BasedOnStyles = Vale, Google, PICSA

# Spelling belongs to cspell (cspell.json), which also accepts British spellings.
Vale.Spelling = NO
Google.Spelling = NO
# British style does not use the Oxford comma.
Google.OxfordComma = NO
# The guide's house style uses spaced dashes in labelled lists.
Google.EmDash = NO
# Advisory until the existing pages are cleaned up.
Google.Latin = warning
Google.LyHyphens = warning
# Active voice, requested in issue #1.
Google.Passive = warning
